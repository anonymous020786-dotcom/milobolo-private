<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiloBolo — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #6C63FF, #FF6584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.5); line-height: 1.7; max-width: 400px; margin-bottom: 32px; }
    button {
      background: linear-gradient(135deg, #6C63FF, #8B5CF6);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="logo">MiloBolo</div>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>MiloBolo requires an internet connection to match you with strangers. Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
