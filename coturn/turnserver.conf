# MiloBolo Coturn TURN Server Config
# VPS IP: 187.127.182.5

listening-port=3478
tls-listening-port=5349
listening-ip=187.127.182.5
relay-ip=187.127.182.5
external-ip=187.127.182.5

# Realm
realm=chat.videodownloaders.cloud
server-name=chat.videodownloaders.cloud

# Auth — change this to match NEXT_PUBLIC_TURN_CREDENTIAL
lt-cred-mech
user=milobolo:change_this_turn_secret

# TLS (optional — needs certs)
# cert=/etc/letsencrypt/live/chat.videodownloaders.cloud/fullchain.pem
# pkey=/etc/letsencrypt/live/chat.videodownloaders.cloud/privkey.pem

# Limits
total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Logging
log-file=/var/log/coturn/turn.log
verbose
